# DOSBox configuration for TSR Demo
# This config file is auto-generated for the TSR demonstration

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=800x600
output=opengl
autolock=false
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper-0.74-3.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=16

[render]
frameskip=0
aspect=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=auto
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[midi]
mpu401=intelligent
mididevice=default
midiconfig=

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false
gusrate=44100
gusbase=240
gusirq=5
gusdma=3
ultradir=C:\ULTRASND

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100
disney=true

[joystick]
joysticktype=auto
timed=true
autofire=false
swap34=false
buttonwrap=false

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
# Lines in this section will be run at startup.
@echo off
echo.
echo ============================================
echo   Welcome to TSR Demo Environment
echo ============================================
echo.
echo Available demos:
echo   CLOCK.COM  - Real-time clock in top-right corner
echo   HOTKEY.COM - Press F12 for popup message
echo.
echo Type the program name to run it.
echo Both can run simultaneously!
echo.
echo ============================================
echo.
